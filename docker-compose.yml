# Local development: one PostgreSQL instance.
#   docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: smartqueue
      POSTGRES_PASSWORD: smartqueue
      POSTGRES_DB: smartqueue
    ports:
      - "5432:5432"
    volumes:
      - smartqueue_data:/var/lib/postgresql/data

volumes:
  smartqueue_data:
